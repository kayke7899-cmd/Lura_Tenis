<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="pt-br">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Lura Tênis</title>
</head>
<body>
    <h1>Contato</h1>
    <a href="index.html">Voltar para a página inicial</a>
    <hr>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite o seu nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Digite o seu email" required><br><br>

        <label for="telefone">Telefone:</label>
        <input type="tel" name="telefone" id="telefone" placeholder="Digite o seu telefone" required><br><br>

        <label for="interesse">Serviço ou produto de interesse:</label><br>
        <select id="interesse">
            <option>Nike Air Force Essential</option>
            <option>Nike AT</option>
            <option>Adidas Adizero SL</option>
            <option>Adidas Adizero Evo SL</option>
            <option>Adidas Samba OG</option>
        </select><br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea name="mensagem" id="mensagem" rows="5" cols="30" placeholder="Digite sua mensagem aqui..." required></textarea><br><br>

        <input type="checkbox" name="newsletter" id="newsletter"><label for="termos">Aceitos os termos</label><br><br>
    

        <input type="submit" value="Enviar">
    </form>
     <footer>
        <p>&copy; 2026 Lura Tênis. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
